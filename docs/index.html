<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetraRide · PetraVoice live demo</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { --navy: #00174b; --green: #10b981; --muted: #64748b; }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: var(--navy);
        font-family: Tajawal, "Segoe UI", system-ui, sans-serif; text-align: center; }
      .card { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 36px 28px; box-shadow: 0 20px 50px rgb(15 23 42 / 0.12); }
      .logo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: var(--navy); color: #fff; display: grid; place-items: center;
        font: 800 34px/1 system-ui, sans-serif; }
      h1 { font-size: 24px; }
      p { margin-top: 10px; color: var(--muted); font-size: 16px; line-height: 1.6; }
      .spin { width: 34px; height: 34px; margin: 22px auto 0; border-radius: 50%; border: 4px solid #e2e8f0; border-top-color: var(--navy); animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      a.btn { display: inline-block; margin-top: 20px; padding: 14px 26px; border-radius: 999px; background: var(--navy); color: #fff; text-decoration: none; font-weight: 700; }
      .en { direction: ltr; font-family: system-ui, sans-serif; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">P</div>
      <h1>بترا فويس · PetraVoice</h1>

      <div id="opening">
        <p>جاري فتح التجربة الحية…</p>
        <p class="en">Opening the live demo…</p>
        <div class="spin" aria-hidden="true"></div>
      </div>

      <div id="offline" hidden>
        <p>التجربة الحية غير متاحة الآن — جرّب بعد قليل.</p>
        <p class="en">The live demo isn’t running right now — please try again shortly.</p>
      </div>

      <a id="go" class="btn" hidden>افتح التطبيق · Open the app</a>
    </main>

    <script>
      // Forwards to the Cloudflare tunnel that is running right now. demo/publish-link.js writes its
      // URL to demo.json each time `npm run tunnel` starts, so this page's address never changes.
      ;(async () => {
        const show = (id) => document.getElementById(id).removeAttribute('hidden')
        try {
          const res = await fetch('demo.json?t=' + Date.now(), { cache: 'no-store' })
          const { url } = await res.json()
          if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url || '')) throw new Error('no live link')
          const go = document.getElementById('go')
          go.href = url
          setTimeout(() => show('go'), 2500) // in case the redirect is blocked
          location.replace(url)
        } catch {
          document.getElementById('opening').setAttribute('hidden', '')
          show('offline')
        }
      })()
    </script>
  </body>
</html>
